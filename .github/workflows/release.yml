name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev pkg-config
      - run: cargo install cargo-packager --locked
      - run: cargo packager -p foto-desktop --release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/packages/*.dmg
            target/packages/*.deb
            target/packages/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cargo install cargo-ndk --locked
      - name: Build APK
        working-directory: android
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME ./gradlew assembleRelease --console=plain
      - run: cp android/app/build/outputs/apk/release/app-release.apk foto-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: foto-${{ github.ref_name }}.apk
